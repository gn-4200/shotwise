locations:
  Kharsa:
    look: "walled flat-roofed sandstone town at the edge of white salt flats, one gate, lantern-lit lanes, salt dust on every surface"
  The White Field:
    look: "salt pans at dawn, shallow water like mirrors, wooden rakes, white salt mounds, two camels, pale pink sky"
  The Salt Cave:
    look: "old salt-mine tunnel, crystal walls glowing amber in lamplight, a hidden chamber, salt dust in the air"
  The Salt Road:
    look: "caravan track across tall dunes, stone cairns, wind-blown sand, bones of old carts, hard sunlight"
  Amma's House:
    look: "small clay-walled room, hearth fire, hanging oil lamp, woven rug, a curtain to the sleeping room"
